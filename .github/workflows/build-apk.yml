
name: Build NEXORA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Download Project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Find and Extract Project
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" ! -name "NEXORA-APK.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP file not found"
            exit 1
          fi

          echo "Found project: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          set -o pipefail

          gradle -p "$PROJECT_DIR" \
            --no-daemon \
            assembleDebug \
            --stacktrace 2>&1 | tee build.log

      - name: Find APK Files
        run: |
          mkdir -p final-apk

          find "$PROJECT_DIR" -type f -name "*.apk" \
            -exec cp {} final-apk/ \;

          if [ -z "$(ls -A final-apk)" ]; then
            echo "ERROR: No APK files were generated"

            echo "Checking build outputs:"
            find "$PROJECT_DIR" -type d -name outputs -print

            echo "Build log:"
            tail -n 100 build.log

            exit 1
          fi

          echo "APK FILES FOUND:"
          ls -lh final-apk/

      - name: Create APK ZIP
        run: |
          cd final-apk
          zip -r ../NEXORA-APK.zip .

      - name: Upload Final APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-APK
          path: NEXORA-APK.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload Raw APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-APK-Direct
          path: final-apk/*.apk
          if-no-files-found: error
          retention-days: 7
