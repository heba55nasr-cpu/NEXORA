name: Build NEXORA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Download Project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Components
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Find and Extract Project
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" ! -name "NEXORA-APK.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP file not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          gradle -p "$PROJECT_DIR" --no-daemon assembleDebug --stacktrace | tee build.log || {
            echo "=== ROOT CAUSE ==="
            grep -E "FAILURE:|Caused by:|> Could not|> Failed" build.log | head -n 25
            exit 1
          }

      - name: Find APK Files
        run: |
          mkdir -p final-apk

          find "$PROJECT_DIR" -type f -name "*.apk" -exec cp {} final-apk/ \;

          if [ -z "$(ls -A final-apk)" ]; then
            echo "ERROR: No APK files were generated"
            exit 1
          fi

      - name: Create APK ZIP
        run: |
          cd final-apk
          zip -r ../NEXORA-APK.zip .

      - name: Upload Final APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-APK
          path: NEXORA-APK.zip
          if-no-files-found: error
          retention-days: 7
